[project]
name = "stock-signals"
version = "0.1.0"
description = "Personal NSE swing + positional signal bot"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    # <4.11: mongomock (tests) does not support the bulk `sort` argument added in 4.11.
    "pymongo>=4.8,<4.11",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "yfinance>=0.2.54",
    "python-telegram-bot[job-queue]>=21.0",
    "lightgbm>=4.3",
]

[project.scripts]
stock-signals = "stock_signals.cli:main"

[dependency-groups]
dev = ["pytest>=8", "mongomock>=4.2", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stock_signals"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/stock_signals/report.py" = ["E501"]  # inline JS/CSS
